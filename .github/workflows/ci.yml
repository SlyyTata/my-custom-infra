
name: To automate the infrastructure with Terraform

#Adding triggers for the workflow
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 👈 This line adds the manual "Run workflow" button

jobs:
  build:
    permissions:
      # Asking github to generate a token from the OIDC and permission to create resources in the AWS console 
      id-token: write  
      # Giving this workflow permission to read repo codes
      contents: read
      
    #Asking this workflow to be run on a fresh latest ubuntu machine
    runs-on: ubuntu-latest
    
    #This is the list of actions that will be executed in this workflow
    steps:

      #copy the repo code to the workflow machine so this workflow can access it.
      - name: Checkout
        uses: actions/checkout@v4

        #To configure AWS credential with the OIDC connection
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.ROLE }}

       #To setup terraform in the workflow machine
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      #to Initialize terraform.
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
          TF_VAR_vpc_name: ${{ secrets.vpc_name }}
          TF_VAR_cidr_block: ${{ secrets.cidr_block }}
          TF_VAR_pub_subnet_cidr_block: ${{ secrets.pub_subnet_cidr_block }}
          TF_VAR_pub_subnet_cidr_block_2: ${{ secrets.pub_subnet_cidr_block_2 }}
          TF_VAR_priv_subnet_cidr_block_1: ${{ secrets.priv_subnet_cidr_block_1 }}
          TF_VAR_priv_subnet_cidr_block_2: ${{ secrets.priv_subnet_cidr_block_2 }}
          TF_VAR_region: ${{ secrets.region }}
          TF_VAR_docker-image: ${{ secrets.docker-image }}
          TF_VAR_ecs_cluster_name: ${{ secrets.ecs_cluster_name }}
          TF_VAR_ecs_service_name: ${{ secrets.ecs_service_name }}
          TF_VAR_ecs_task_definition_name: ${{ secrets.ecs_task_definition_name }}
          TF_VAR_lb_name: ${{ secrets.lb_name }}
          TF_VAR_container_port: ${{ secrets.container_port }}
          TF_VAR_container_name: ${{ secrets.container_name }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
